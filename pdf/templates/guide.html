<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
    @page {
        size: A4;
        margin: 32mm 28mm 30mm 28mm;
        @bottom-center {
            content: "${brand}  ·  " counter(page) " / " counter(pages);
            font-family: "Oswald", "Segoe UI", Arial, sans-serif;
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #ffffff;
        }
    }

    * { box-sizing: border-box; }

    body {
        font-family: "Roboto", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        color: #191919;
        line-height: 1.62;
        font-size: 12.5px;
        margin: 0;
    }

    .pageframe {
        position: fixed;
        top: -32mm;
        left: -28mm;
        width: 210mm;
        height: 297mm;
        z-index: -1;
    }
    .pageframe img { width: 100%; height: 100%; display: block; }

    h1 {
        font-family: "Oswald", "Segoe UI", Arial, sans-serif;
        font-size: 33px;
        line-height: 1.08;
        margin: 0 0 8px 0;
        color: #0d0d0d;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
    }

    .title-rule {
        width: 84px;
        height: 5px;
        background: ${accent};
        margin: 0 0 20px 0;
    }

    .content p {
        margin: 0 0 12px 0;
        text-align: justify;
    }

    .content h2 {
        font-family: "Oswald", "Segoe UI", Arial, sans-serif;
        font-size: 18px;
        margin: 20px 0 8px 0;
        color: ${accent};
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.8px;
    }
</style>
</head>
<body>
    ${frame}
    <h1>${title}</h1>
    <div class="title-rule"></div>
    <div class="content">
        ${body}
    </div>
</body>
</html>
