<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
    @page {
        size: A4;
        margin: 48mm 20mm 22mm 20mm;
        @bottom-center {
            content: "${brand}  ·  " counter(page) " / " counter(pages);
            font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            font-size: 9px;
            color: #9a9a9a;
        }
    }

    * { box-sizing: border-box; }

    body {
        font-family: "Roboto", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        color: #111111;
        line-height: 1.64;
        font-size: 12.5px;
        margin: 0;
    }

    .sidebrush {
        position: fixed;
        top: -52mm;
        left: -30mm;
        transform: rotate(-9deg);
        z-index: -1;
    }
    .sidebrush img { width: 112mm; height: auto; display: block; }

    h1 {
        font-family: "Oswald", "Segoe UI", Arial, sans-serif;
        font-size: 40px;
        line-height: 1.08;
        margin: 0 0 26px 0;
        color: #0d0d0d;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        text-align: center;
    }

    .content p {
        margin: 0 0 12px 0;
        text-align: justify;
    }

    .content h2 {
        font-family: "Oswald", "Segoe UI", Arial, sans-serif;
        font-size: 18px;
        margin: 22px 0 8px 0;
        color: #0d0d0d;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.6px;
    }
</style>
</head>
<body>
    ${side}
    <h1>${title}</h1>
    <div class="content">
        ${body}
    </div>
</body>
</html>
