<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
    @page {
        size: A4;
        margin: 20mm 18mm 18mm 18mm;
        @bottom-center {
            content: "${brand}  ·  " counter(page) " / " counter(pages);
            font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            font-size: 9px;
            color: #8a8a8a;
        }
    }

    * { box-sizing: border-box; }

    body {
        font-family: "Roboto", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        color: #1c1c1c;
        line-height: 1.62;
        font-size: 12.5px;
        margin: 0;
    }

    .brandbar {
        background: #101010;
        border-bottom: 3px solid ${accent};
        padding: 16px 20px;
        margin-bottom: 26px;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .brandbar .name {
        font-family: "Oswald", "Segoe UI", Arial, sans-serif;
        color: #ffffff;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
    }

    .brandbar .accent {
        color: ${accent};
        font-weight: 800;
    }

    .logo { max-height: 40px; }

    h1 {
        font-family: "Oswald", "Segoe UI", Arial, sans-serif;
        font-size: 34px;
        line-height: 1.1;
        margin: 0 0 6px 0;
        color: #101010;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
    }

    .title-rule {
        width: 90px;
        height: 5px;
        background: ${accent};
        margin: 0 0 24px 0;
    }

    .content p {
        margin: 0 0 12px 0;
        text-align: justify;
    }

    .content h2 {
        font-family: "Oswald", "Segoe UI", Arial, sans-serif;
        font-size: 18px;
        margin: 24px 0 8px 0;
        color: ${accent};
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.8px;
    }

    .rule {
        height: 2px;
        background: linear-gradient(90deg, ${accent} 0%, transparent 75%);
        margin: 22px 0;
        border: none;
    }
</style>
</head>
<body>
    <div class="brandbar">
        <span class="name">АЛЁХИНА <span class="accent">БЕЗ ТОРМОЗОВ</span></span>
        ${logo_block}
    </div>
    <h1>${title}</h1>
    <div class="title-rule"></div>
    <div class="content">
        ${body}
    </div>
    <hr class="rule">
</body>
</html>
