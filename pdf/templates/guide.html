<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
    @page {
        size: A4;
        margin: 22mm 18mm 18mm 18mm;
        @bottom-center {
            content: "${brand}  ·  " counter(page) " / " counter(pages);
            font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            font-size: 9px;
            color: #8a8a8a;
        }
    }

    * { box-sizing: border-box; }

    body {
        font-family: "Roboto", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        color: #1c1c1c;
        line-height: 1.62;
        font-size: 12.5px;
        margin: 0;
    }

    .brandbar {
        background: #0d0d0d;
        margin: -22mm -18mm 0 -18mm;
        padding: 20px 18mm 22px 18mm;
        text-align: left;
    }

    .logo { height: 92px; max-width: 62%; display: inline-block; vertical-align: middle; }

    .brushband {
        margin: 0 -18mm 22px -18mm;
        line-height: 0;
    }

    .brush {
        display: block;
        width: 100%;
        height: auto;
        margin-top: -14px;
    }

    h1 {
        font-family: "Oswald", "Segoe UI", Arial, sans-serif;
        font-size: 33px;
        line-height: 1.08;
        margin: 0 0 8px 0;
        color: #0d0d0d;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
    }

    .title-rule {
        width: 84px;
        height: 5px;
        background: ${accent};
        margin: 0 0 22px 0;
    }

    .content p {
        margin: 0 0 12px 0;
        text-align: justify;
    }

    .content h2 {
        font-family: "Oswald", "Segoe UI", Arial, sans-serif;
        font-size: 18px;
        margin: 22px 0 8px 0;
        color: ${accent};
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.8px;
    }
</style>
</head>
<body>
    <div class="brandbar">${header}</div>
    <div class="brushband">${brush}</div>
    <h1>${title}</h1>
    <div class="title-rule"></div>
    <div class="content">
        ${body}
    </div>
</body>
</html>
