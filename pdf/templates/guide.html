<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
    @page {
        size: A4;
        margin: 20mm 18mm 18mm 18mm;
        @bottom-center {
            content: "${brand}  ·  " counter(page) " / " counter(pages);
            font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            font-size: 9px;
            color: #9a9a9a;
        }
    }

    * { box-sizing: border-box; }

    body {
        font-family: "Roboto", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        color: #191919;
        line-height: 1.62;
        font-size: 12.5px;
        margin: 0;
    }

    .topbrush {
        margin: -12mm -18mm 2px -18mm;
        line-height: 0;
    }
    .topbrush img { width: 100%; height: auto; display: block; }

    h1 {
        font-family: "Oswald", "Segoe UI", Arial, sans-serif;
        font-size: 34px;
        line-height: 1.08;
        margin: 0 0 8px 0;
        color: #0d0d0d;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
    }

    .title-rule {
        width: 88px;
        height: 5px;
        background: ${accent};
        margin: 0 0 22px 0;
    }

    .content p {
        margin: 0 0 12px 0;
        text-align: justify;
    }

    .content h2 {
        font-family: "Oswald", "Segoe UI", Arial, sans-serif;
        font-size: 18px;
        margin: 22px 0 8px 0;
        color: ${accent};
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.8px;
    }

    .botbrush { margin: 26px 0 0 0; line-height: 0; }
    .botbrush img { width: 44%; height: auto; display: block; transform: scaleX(-1); opacity: 0.92; }
</style>
</head>
<body>
    <div class="topbrush">${brush}</div>
    <h1>${title}</h1>
    <div class="title-rule"></div>
    <div class="content">
        ${body}
    </div>
    <div class="botbrush">${brush}</div>
</body>
</html>
