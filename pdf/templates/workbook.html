<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>

    @page {
        size: A4;
        margin: 22mm 18mm 20mm 18mm;
        @bottom-left {
            content: "${brand}";
            font-family: "Oswald", "Arial Narrow", Arial, sans-serif;
            font-size: 8.5px;
            letter-spacing: 1.6px;
            color: #9a9a9a;
        }
        @bottom-right {
            content: "PDF ${code}  ·  " counter(page) " / " counter(pages);
            font-family: "Oswald", "Arial Narrow", Arial, sans-serif;
            font-size: 8.5px;
            letter-spacing: 1px;
            color: #9a9a9a;
        }
    }
    @page :first { margin-top: 46mm; }

    * { box-sizing: border-box; }

    body {
        font-family: "Roboto", Arial, sans-serif;
        color: #151515;
        font-size: 11.5px;
        line-height: 1.55;
        margin: 0;
    }

    .sidebrush { position: absolute; top: -50mm; left: -28mm; transform: rotate(-9deg); z-index: -1; }
    .sidebrush img { width: 104mm; height: auto; display: block; }
    .logo-tr { position: absolute; top: -38mm; right: -10mm; z-index: -1; }
    .logo-tr img { width: 28mm; height: auto; display: block; }

    .eyebrow {
        font-family: "Oswald", "Arial Narrow", Arial, sans-serif;
        font-size: 11px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: ${accent};
        margin: 0 0 4px 0;
    }
    h1 {
        font-family: "Oswald", "Arial Narrow", Arial, sans-serif;
        font-weight: 700;
        font-size: 44px;
        line-height: 1.02;
        text-transform: uppercase;
        margin: 0 0 10px 0;
        color: #0d0d0d;
    }
    .subtitle {
        font-size: 15px;
        line-height: 1.35;
        font-weight: 600;
        margin: 0 0 18px 0;
        max-width: 150mm;
    }

    .meta { display: flex; gap: 6mm; margin: 0 0 10mm 0; }
    .meta div { flex: 1; border-left: 3px solid ${accent}; padding: 2px 0 2px 10px; }
    .meta b {
        display: block;
        font-family: "Oswald", "Arial Narrow", Arial, sans-serif;
        font-weight: 500;
        font-size: 10px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #6b6b6b;
        margin-bottom: 2px;
    }
    .meta p { margin: 0; }

    .block {
        display: flex;
        gap: 5mm;
        padding: 6mm 0;
        border-top: 1px solid #e4e4e4;
        break-inside: avoid;
    }
    .num {
        font-family: "Oswald", "Arial Narrow", Arial, sans-serif;
        font-weight: 700;
        font-size: 34px;
        line-height: 0.9;
        color: ${accent};
        width: 16mm;
        flex: none;
    }
    .block-body { flex: 1; }
    .tag {
        font-family: "Oswald", "Arial Narrow", Arial, sans-serif;
        font-size: 9.5px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #8a8a8a;
    }
    h2 {
        font-family: "Oswald", "Arial Narrow", Arial, sans-serif;
        font-weight: 600;
        font-size: 18px;
        line-height: 1.2;
        margin: 1px 0 8px 0;
        color: #0d0d0d;
    }
    .field { margin: 0 0 6px 0; }
    .field .label {
        font-family: "Oswald", "Arial Narrow", Arial, sans-serif;
        font-weight: 500;
        font-size: 10px;
        letter-spacing: 1.4px;
        text-transform: uppercase;
        color: #0d0d0d;
    }
    .field p { margin: 1px 0 0 0; }
    .field.warn { background: #fff1f0; border-left: 3px solid ${accent}; padding: 5px 9px; }
    .field.warn .label { color: ${accent}; }

    .table-wrap { margin: 8mm 0 0 0; break-inside: avoid; }
    h3 {
        font-family: "Oswald", "Arial Narrow", Arial, sans-serif;
        font-weight: 600;
        font-size: 15px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        margin: 0 0 8px 0;
    }
    table { width: 100%; border-collapse: collapse; }
    th {
        font-family: "Oswald", "Arial Narrow", Arial, sans-serif;
        font-weight: 500;
        font-size: 10px;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        text-align: left;
        background: #0d0d0d;
        color: #ffffff;
        padding: 6px 8px;
    }
    td { padding: 6px 8px; border-bottom: 1px solid #e4e4e4; vertical-align: top; }
    tbody tr:nth-child(even) td { background: #f7f7f7; }
    td:first-child { font-weight: 600; }
    table.wide { font-size: 9.5px; }
    table.wide td, table.wide th { padding: 5px 5px; }

    .steps { margin: 10mm 0 0 0; padding: 7mm 8mm; background: #0d0d0d; color: #ffffff; break-inside: avoid; }
    .steps h3 { color: #ffffff; }
    .steps ol { list-style: none; margin: 0; padding: 0; }
    .steps li { display: flex; gap: 4mm; margin: 0 0 7px 0; align-items: flex-start; }
    .steps li span {
        display: block;
        flex: none;
        width: 7mm;
        height: 7mm;
        border-radius: 50%;
        background: ${accent};
        color: #ffffff;
        font-family: "Oswald", "Arial Narrow", Arial, sans-serif;
        font-weight: 600;
        font-size: 11px;
        text-align: center;
        line-height: 7mm;
    }
    .steps li p { margin: 2px 0 0 0; }
</style>
</head>
<body>
    ${side}
    ${logo}
    <div class="eyebrow">PDF ${code} · ${kind}</div>
    <h1>${title}</h1>
    <p class="subtitle">${subtitle}</p>
    <div class="meta">
        <div><b>Для кого</b><p>${audience}</p></div>
        <div><b>Зачем</b><p>${purpose}</p></div>
    </div>
    ${blocks}
    ${tables}
    ${steps}
</body>
</html>
