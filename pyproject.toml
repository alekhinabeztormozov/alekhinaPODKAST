[project]
name = "alehina-bot"
version = "0.1.0"
description = "Автоматизация подкаста «Алёхина без тормозов»"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".venv", "graphify-out", "media/out", "media/tmp", "db/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
